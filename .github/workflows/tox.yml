name: Run Checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Run Checks
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: |
            3.10
            3.11
            3.12
            3.13
            3.14
      - name: Install tox
        run: |
          python -m pip install --upgrade pip
          pip install tox~=4.53.1
      - name: Run tox
        run: |
          tox run-parallel --parallel-no-spinner
